<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="125" y="20" width="150" height="44" rx="6"/>
    <rect x="35" y="160" width="150" height="44" rx="6"/>
    <rect x="215" y="160" width="150" height="44" rx="6"/>
    <rect x="35" y="290" width="150" height="44" rx="6"/>
  </g>
  <g fill="#111" font-size="16" text-anchor="middle">
    <text x="200" y="47">living content</text>
    <text x="110" y="187">important part</text>
    <text x="290" y="187">the transcript</text>
    <text x="110" y="317">fresh flow</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="170" y1="64" x2="110" y2="160" marker-end="url(#arr)"/>
    <line x1="230" y1="64" x2="290" y2="160" marker-end="url(#arr)"/>
    <line x1="110" y1="204" x2="110" y2="290" marker-end="url(#arr)"/>
  </g>
  <g fill="#111" font-size="14">
    <text x="128" y="100" text-anchor="end">weighed by</text>
    <text x="124" y="118" text-anchor="end">importance</text>
    <text x="272" y="100">the rest</text>
    <text x="272" y="118">stays in</text>
    <text x="122" y="252">passes to</text>
  </g>
</svg>
