<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" width="400" height="410" font-family="Helvetica, Arial, sans-serif" color="#000">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="40" y="20" width="320" height="64" rx="6"/>
    <rect x="6" y="190" width="176" height="60" rx="6"/>
    <rect x="218" y="190" width="176" height="60" rx="6"/>
    <rect x="6" y="330" width="176" height="60" rx="6"/>
    <rect x="218" y="330" width="176" height="60" rx="6"/>
    <line x1="94" y1="84" x2="94" y2="190" marker-end="url(#ah)"/>
    <line x1="306" y1="84" x2="306" y2="190" marker-end="url(#ah)"/>
    <polyline points="250,250 250,290 94,290 94,330" marker-end="url(#ah)"/>
    <line x1="306" y1="250" x2="306" y2="330" marker-end="url(#ah)"/>
  </g>
  <g fill="currentColor" font-size="15">
    <text x="200" y="47" text-anchor="middle" font-size="16">a flow, told of a thing</text>
    <text x="200" y="69" text-anchor="middle" font-size="16">it did not itself do</text>
    <text x="94" y="215" text-anchor="middle">its own predecessors,</text>
    <text x="94" y="235" text-anchor="middle">at a depth</text>
    <text x="306" y="215" text-anchor="middle">any other permaflow,</text>
    <text x="306" y="235" text-anchor="middle">at a depth</text>
    <text x="94" y="365" text-anchor="middle">that flow's transcript</text>
    <text x="306" y="355" text-anchor="middle">the running flow</text>
    <text x="306" y="375" text-anchor="middle">that holds it</text>
    <text x="98" y="140">remembers down</text>
    <text x="302" y="165" text-anchor="end">remembers across</text>
    <text x="170" y="284" text-anchor="middle">by reading</text>
    <text x="314" y="295">by asking</text>
  </g>
</svg>
